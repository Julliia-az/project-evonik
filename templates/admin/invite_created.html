{% extends "base.html" %}{% block content %}
<section class="narrow panel">
  <p class="eyebrow">CONVITE GERADO</p>
  <h1>{{ name }} foi cadastrado(a).</h1>
  <p>Copie o link individual e compartilhe com o colaborador.</p>
  <div class="copy-field">
    <input id="inviteLink" readonly value="{{ invite_url }}" /><button
      class="secondary"
      data-copy-target="inviteLink"
    >
      Copiar
    </button>
  </div>
  <a class="text-link" href="{{ url_for('admin_dashboard') }}"
    >Voltar ao painel →</a
  >
</section>
{% endblock %}
