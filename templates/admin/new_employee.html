{% extends "base.html" %}{% block content %}<a
  class="back"
  href="{{ url_for('admin_dashboard') }}"
  >← Painel RH</a
>
<section class="narrow panel">
  <p class="eyebrow">NOVO CONVITE</p>
  <h1>Cadastrar colaborador</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><label
      >Nome completo<input name="name" required /></label
    ><label
      >E-mail corporativo<input type="email" name="email" required /></label
    ><label>Departamento<input name="department" required /></label
    ><label>Cargo (opcional)<input name="role" /></label
    ><button class="primary">Cadastrar e gerar convite</button>
  </form>
</section>
{% endblock %}
